# Logs do Docker crescem sem limite por padrão e a VPS é compartilhada:
# cada container guarda no máximo 3 arquivos de 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # AOF: filas de automações e campanhas (BullMQ) sobrevivem a reinícios.
    # noeviction: o BullMQ exige — sob falta de memória o Redis recusa escrita
    # em vez de apagar jobs da fila em silêncio.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - novacrm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - BACKGROUND_WORKER_ENABLED=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - supabase_default
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging
    # Tempo para terminar o envio em andamento antes do SIGKILL (ver src/worker.ts).
    stop_grace_period: 60s
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MIGRATION_URL=
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - default
      - supabase_default
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/worker.ts"]
    command: []

networks:
  default: {}
  supabase_default:
    external: true

volumes:
  novacrm_redis:
